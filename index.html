<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta Laman Sihat Ayam Brand – SK Seri Bonus</title>
<style>
:root{--bg:#eaf6e3;--card:#fffdf2;--ink:#1f3d1f;--green:#1b7a34;--yellow:#ffd23f;--line:#d8e8c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f12;--card:#1a2c1c;--ink:#eaf5df;--green:#4cc26a;--line:#2d4630;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1f12;--card:#1a2c1c;--ink:#eaf5df;--green:#4cc26a;--line:#2d4630;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
header h1{font-size:1.05rem;margin:0;line-height:1.2}
header small{display:block;font-weight:400;opacity:.75}
.stars{font-size:1.4rem;letter-spacing:2px;white-space:nowrap}
.stars span{filter:grayscale(1);opacity:.35;transition:.4s}
.stars span.on{filter:none;opacity:1;animation:pop .5s}
#view{position:relative;width:calc(100% - 20px);margin:0 10px;aspect-ratio:3/2;overflow:hidden;border-radius:18px;border:3px solid var(--green);background:#000;touch-action:manipulation}
#stage{position:absolute;inset:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.65,0,.25,1)}
#stage img{width:100%;height:100%;display:block}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
.path{fill:none;stroke:#fff;stroke-width:7;stroke-dasharray:4 18;stroke-linecap:round;animation:march 1.2s linear infinite;filter:drop-shadow(0 0 3px #0008)}
@keyframes march{to{stroke-dashoffset:-22}}
.mk{cursor:pointer}
.mk .ring{fill:none;stroke:var(--yellow);stroke-width:8;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.mk .dot{fill:#ffd23f;stroke:#1b7a34;stroke-width:7}
.mk text{font:800 54px "Baloo 2",system-ui,sans-serif;fill:#14541f;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.done .dot{fill:#6fdc7e}
.mk .bob{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.zoomed .mk{opacity:.0;pointer-events:none}
@keyframes ping{0%{transform:scale(.8);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.leaf{position:absolute;top:-30px;font-size:22px;pointer-events:none;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(420px) rotate(360deg)}}
#bar{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:var(--green);color:#fff}
button.alt{background:var(--yellow);color:#4a3b00}
button:active{transform:scale(.96)}
#card{margin:0 10px 18px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:150px;animation:slide .5s}
@keyframes slide{from{transform:translateY(14px);opacity:0}}
#card h2{margin:0 0 4px;font-size:1.15rem}
#card .tag{display:inline-block;background:var(--yellow);color:#4a3b00;border-radius:999px;padding:1px 12px;font-weight:800;margin-bottom:6px}
#card p{margin:6px 0}
.q{margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
.opts{display:grid;gap:8px;margin-top:8px}
.opts button{background:var(--bg);color:var(--ink);border:2px solid var(--green);text-align:left;border-radius:14px}
.opts button.ok{background:#2e9e4a;color:#fff}
.opts button.no{background:#d9534f;color:#fff;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#splash{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#2f9e44,#a8e063);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;transition:opacity .7s,visibility .7s}
#splash.hide{opacity:0;visibility:hidden}
#splash h1{font-size:2rem;margin:.2em 0;text-shadow:0 3px 0 #0003}
#splash .big{font-size:4rem;animation:bob 1.2s infinite}
#splash button{background:var(--yellow);color:#4a3b00;font-size:1.15rem;padding:14px 28px;margin-top:18px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#win{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
#win i{position:absolute;top:-30px;font-style:normal;font-size:28px;animation:fall2 2.8s ease-in forwards}
@keyframes fall2{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

<div id="bar">

  <button class="alt" id="all">🗺 Lihat Semua</button>
</div>
<div id="card"><h2>Selamat datang! 👋</h2><p>Ketik penanda <b>1</b>, <b>2</b> atau <b>3</b> pada peta untuk meneroka, atau tekan <b>Mula Lawatan</b> untuk dipandu. Jawab kuiz untuk kumpul bintang ⭐</p></div>

<script>
var Z=[
{n:1,x:.846,y:.33,fx:.85,fy:.6,s:2.3,t:"Pemakanan Sihat | Vertical | Hidroponik",e:"🥬",
 d:"Sayur ditanam secara menegak dalam paip tanpa tanah. Akarnya menyerap air bernutrien, jadi jimat ruang dan air. Sayur segar ini baik untuk pemakanan sihat berkualiti!",
 q:"Apakah yang diperlukan oleh sayur hidroponik untuk tumbuh, selain tanah?",o:["Air bernutrien","Minyak masak","Pasir pantai"],a:0},
{n:2,x:.482,y:.327,fx:.5,fy:.58,s:2.2,t:"Pokok Sayur & Herba | Pokok Saintis Celik",e:"🌿",
 d:"Di sini murid belajar Sains Hijau Masa Depan. Kita tanam sayur dan herba dalam pasu gantung dan tayar kitar semula, sambil menjadi saintis celik yang pandai memerhati.",
 q:"Apakah yang kita lakukan pada tayar lama di kebun ini?",o:["Buang ke sungai","Kitar semula jadi pasu","Bakar"],a:1},
{n:3,x:.156,y:.34,fx:.18,fy:.6,s:2.3,t:"Pokok Makan Pelangi",e:"🌈",
 d:"Makan buah dan sayur pelbagai warna: merah, jingga, kuning, hijau, ungu. Setiap warna memberi zat berbeza untuk badan yang sihat dan cergas.",
 q:"Mengapa kita perlu makan makanan pelbagai warna?",o:["Supaya cantik di pinggan sahaja","Setiap warna beri zat berbeza","Supaya cepat kenyang"],a:0+1}
];
var $=function(i){return document.getElementById(i)},stage=$("stage"),view=$("view"),card=$("card"),svg=$("svg");
var done={},touring=false,cur=-1;
// markers
Z.forEach(function(z,i){
 var g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","mk");g.id="mk"+i;
 g.innerHTML='<g class="bob"><circle class="ring" cx="'+z.x*1536+'" cy="'+z.y*1024+'" r="42"/><circle class="dot" cx="'+z.x*1536+'" cy="'+z.y*1024+'" r="42"/><text x="'+z.x*1536+'" y="'+z.y*1024+'">'+z.n+'</text></g>';
 g.addEventListener("click",function(){touring=false;show(i)});
 svg.appendChild(g);
});
function focus(z){
 var W=view.clientWidth,H=view.clientHeight;
 if(!z){stage.style.transform="none";view.classList.remove("zoomed");return}
 var s=z.s,tx=W/2-z.fx*W*s,ty=H/2-z.fy*H*s;
 tx=Math.min(0,Math.max(W-W*s,tx));ty=Math.min(0,Math.max(H-H*s,ty));
 stage.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")";view.classList.add("zoomed");
}
function show(i){
 cur=i;var z=Z[i];focus(z);
 card.style.animation="none";void card.offsetWidth;card.style.animation="";
 var h='<span class="tag">Zon '+z.n+' '+z.e+'</span><h2>'+z.t+'</h2><p>'+z.d+'</p><div class="q"><b>🧠 Kuiz:</b> '+z.q+'<div class="opts">';
 z.o.forEach(function(o,k){h+='<button data-k="'+k+'">'+o+'</button>'});
 h+='</div></div>';
 if(touring){h+='<p style="text-align:right"><button id="next">'+(i<2?"Seterusnya →":"Selesai ✔")+'</button></p>'}
 card.innerHTML=h;
 card.querySelectorAll(".opts button").forEach(function(b){b.onclick=function(){answer(i,+b.dataset.k,b)}});
 var nx=$("next");if(nx)nx.onclick=function(){if(i<2)show(i+1);else{touring=false;overview()}};
 card.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function answer(i,k,b){
 var z=Z[i],btns=card.querySelectorAll(".opts button");
 if(k===z.a){
  btns.forEach(function(x){x.disabled=true});b.classList.add("ok");b.textContent="✅ "+b.textContent;
  if(!done[i]){done[i]=1;$("mk"+i).classList.add("done");stars()}
 }else{b.classList.add("no");b.disabled=true}
}
function stars(){
 var n=Object.keys(done).length;
 document.querySelectorAll("#stars span").forEach(function(s,k){s.classList.toggle("on",k<n)});
 if(n===3){setTimeout(function(){
  card.innerHTML='<h2>🎉 Tahniah, Pakar Laman Sihat!</h2><p>Anda telah meneroka semua zon dan mengumpul 3 bintang. Jom amalkan pemakanan sihat bersama Ayam Brand!</p>';
  rain()},900)}
}
function rain(){
 var w=$("win"),e=["🌱","⭐","🥬","🌈","🌻","🍅"];
 for(var i=0;i<40;i++){var s=document.createElement("i");s.textContent=e[i%e.length];s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*1.2+"s";w.appendChild(s)}
 setTimeout(function(){w.innerHTML=""},5000);
}
function overview(){
 cur=-1;focus(null);
 card.innerHTML='<h2>Peta Penuh 🗺</h2><p>Ketik penanda bernombor untuk meneroka zon. Titik kuning menunjukkan laluan lawatan dari 1 → 2 → 3.</p>';
}
$("tour").onclick=function(){touring=true;show(0)};
$("all").onclick=function(){touring=false;overview()};
$("go").onclick=function(){$("splash").classList.add("hide")};
window.addEventListener("resize",function(){if(cur>=0)focus(Z[cur])});
// falling leaves
for(var i=0;i<7;i++){var l=document.createElement("div");l.className="leaf";l.textContent=i%2?"🍃":"🌿";l.style.left=(8+i*14)+"%";l.style.animationDuration=(6+i)+"s";l.style.animationDelay=(-i*2)+"s";view.appendChild(l)}
</script>
